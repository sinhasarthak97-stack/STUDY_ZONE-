name: Build Study Zone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Study Zone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create package.json if missing
        run: |
          if [ ! -f package.json ]; then
            cat > package.json <<'EOF'
            {
              "name": "study-zone",
              "version": "1.0.0",
              "private": true
            }
            EOF
          fi

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.studyzone.app',
            appName: 'Study Zone',
            webDir: '.'
          };

          export default config;
          EOF

      - name: Remove old Android project
        run: |
          rm -rf android

      - name: Create Android project
        run: |
          npx cap add android

      - name: Sync Study Zone
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/Study-Zone.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Zone-APK
          path: release/Study-Zone.apk
