name: Build Study Zone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Study Zone
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/

          if [ -f sw.js ]; then
            cp sw.js www/
          fi

          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest www/
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png www/
          fi

          if [ -f icon-512.png ]; then
            cp icon-512.png www/
          fi

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "study-zone",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install --no-audit --no-fund \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.studyzone.app",
            "appName": "Study Zone",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Study Zone
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release/Study-Zone.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Study-Zone-APK
          path: release/Study-Zone.apk
          if-no-files-found: error
