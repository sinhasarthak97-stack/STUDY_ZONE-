name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        run: echo "PROJECT_DIR=$(dirname $(find . -name package.json -not -path '*/node_modules/*' | head -1))" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
        working-directory: ${{ env.PROJECT_DIR }}
      - run: npm run vendor
        working-directory: ${{ env.PROJECT_DIR }}
      - run: npx cap add android
        working-directory: ${{ env.PROJECT_DIR }}
      - run: npx cap sync android
        working-directory: ${{ env.PROJECT_DIR }}
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}/android
      - uses: actions/upload-artifact@v4
        with:
          name: STUDY_ZONE-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
