name: Build Study Zone APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Get project
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Find the folder containing package.json
      - name: Find project folder
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name package.json \
            -not -path '*/node_modules/*' \
            -not -path './android/*' \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project folder: $PROJECT_DIR"

      # 3. Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 5. Install existing dependencies
      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 6. Install Capacitor
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      # 7. Check Capacitor
      - name: Check Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap --version

      # 8. Build web app
      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found."
            echo "Continuing because the project may already contain built web files."
          fi

      # 9. Create Android project
      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            echo "Android platform does not exist."
            echo "Creating Android platform..."
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      # 10. Sync Capacitor
      - name: Sync Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap sync android

      # 11. Build APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      # 12. Upload APK
      - name: Upload Study Zone APK
        uses: actions/upload-artifact@v4
        with:
          name: STUDY_ZONE-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
