name: Build Study Zone APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Find the actual project containing package.json
      # --------------------------------------------------
      - name: Find project directory
        shell: bash
        run: |
          PACKAGE_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" \
            | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found."
            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "Found package.json:"
          echo "$PACKAGE_FILE"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # Node
      # --------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --------------------------------------------------
      # Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # --------------------------------------------------
      # Build web application
      # --------------------------------------------------
      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          npm run build

      # --------------------------------------------------
      # Add Android
      # --------------------------------------------------
      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      # --------------------------------------------------
      # Sync Capacitor
      # --------------------------------------------------
      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          npx cap sync android

      # --------------------------------------------------
      # Install Pillow for automatic icon generation
      # --------------------------------------------------
      - name: Install image tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      # --------------------------------------------------
      # Automatically apply Study Zone logo
      # --------------------------------------------------
      - name: Apply Study Zone launcher icon
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/assets/study-zone-icon.png" ]; then
            echo "ERROR: assets/study-zone-icon.png was not found."
            exit 1
          fi

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path(
              "${{ github.workspace }}/assets/study-zone-icon.png"
          )

          res = Path("android/app/src/main/res")

          image = Image.open(source).convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              directory = res / folder
              directory.mkdir(parents=True, exist_ok=True)

              icon = image.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(
                  directory / "ic_launcher.png",
                  "PNG",
                  optimize=True
              )

              icon.save(
                  directory / "ic_launcher_round.png",
                  "PNG",
                  optimize=True
              )

          # Remove Android's generated adaptive-icon XML so
          # the PNG launcher icon is used directly.
          adaptive = res / "mipmap-anydpi-v26"

          if adaptive.exists():
              for filename in [
                  "ic_launcher.xml",
                  "ic_launcher_round.xml"
              ]:
                  file = adaptive / filename
                  if file.exists():
                      file.unlink()

          print("Study Zone launcher icon applied successfully.")
          PY

      # --------------------------------------------------
      # Verify launcher icon
      # --------------------------------------------------
      - name: Verify launcher icon
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Launcher icon verification successful."

      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload Study Zone APK
        uses: actions/upload-artifact@v4
        with:
          name: STUDY_ZONE-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
