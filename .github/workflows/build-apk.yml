name: Build Study Zone APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Find project folder
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name package.json \
            -not -path '*/node_modules/*' \
            -not -path './android/*' \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Create Capacitor configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.studyzone.app",
            "appName": "Study Zone",
            "webDir": "dist"
          }
          EOF

          echo "Capacitor configuration:"
          cat capacitor.config.json

      - name: Check Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap --version

      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found."
          fi

      - name: Detect web directory
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -d "dist" ]; then
            WEB_DIR="dist"
          elif [ -d "build" ]; then
            WEB_DIR="build"
          elif [ -d "www" ]; then
            WEB_DIR="www"
          else
            echo "ERROR: No dist, build, or www directory found."
            exit 1
          fi

          echo "Using web directory: $WEB_DIR"

          python3 - <<PY
          import json

          path = "capacitor.config.json"

          with open(path) as f:
              config = json.load(f)

          config["webDir"] = "$WEB_DIR"

          with open(path, "w") as f:
              json.dump(config, f, indent=2)

          print(json.dumps(config, indent=2))
          PY

      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            echo "Creating Android platform..."
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap sync android

      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          echo "Android project successfully created."

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STUDY_ZONE-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
