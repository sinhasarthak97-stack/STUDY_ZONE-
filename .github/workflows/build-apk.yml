name: Build Study Zone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Study Zone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.studyzone.app',
            appName: 'Study Zone',
            webDir: '.',
            bundledWebRuntime: false
          };

          export default config;
          EOF

      - name: Create Android project
        run: |
          npx cap add android

      - name: Copy Study Zone into Android
        run: |
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Study-Zone.apk

      - name: Upload Study Zone APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Zone-APK
          path: release/Study-Zone.apk
